
services:
  - type: web
    name: psg-nexus
    runtime: node
    region: singapore
    plan: free

    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: MONGO_URI
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: MONGODB_COLLECTION
        value: website_chunks

      - key: VECTOR_INDEX_NAME
        value: vector_index

      - key: CHAT_RATE_LIMIT_MAX
        value: "60"
