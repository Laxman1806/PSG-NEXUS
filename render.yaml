services:
  - type: web
    name: psg-nexus
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MONGO_URI
        sync: false
      - key: MONGO_CONNECT_TIMEOUT_MS
        value: "10000"
      - key: SESSION_SECRET
        generateValue: true
      - key: ENABLE_MODEL_STARTUP_CHECK
        value: "true"
